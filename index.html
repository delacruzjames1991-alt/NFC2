.band .photo .face{background:#0E7C86;color:#fff;border:4px solid #fff;box-shadow:0 6px 18px rgba(14,124,134,.28)}
.band .role{color:rgba(255,255,255,.88)}
.band .hint{color:rgba(255,255,255,.75)}
.band .photo:focus-visible{outline-color:#fff}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.photo{position:relative;width:132px;height:132px;border-radius:50%}
.photo .face{position:absolute;inset:0;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font:800 52px "Bricolage Grotesque",sans-serif;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:none}
.photo.has img{display:block}.photo.has span{display:none}
.photo:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 0}
h1{font:800 40px/1.05 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.02em}
.role{margin:6px 0 0;color:var(--muted);font-size:17px}
h2{font:600 18px "Bricolage Grotesque",sans-serif;margin:34px 0 10px}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;color:inherit;text-decoration:none;min-height:60px}
.row+.row{border-top:1px solid var(--line)}
a.row:active{background:var(--bg)}
.ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font:800 16px "Bricolage Grotesque",sans-serif}
.t{display:flex;flex-direction:column;min-width:0}
.t b{font-weight:600}.t small{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.row.split{padding:0}
.call{display:flex;align-items:center;gap:14px;flex:1;min-width:0;align-self:stretch;padding:14px 12px 14px 16px;color:inherit;text-decoration:none}
.call:active{background:var(--bg)}
.save{flex:none;margin-right:14px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:6px 14px;font:600 13px "DM Sans",system-ui,sans-serif;cursor:pointer;min-width:64px}
.save:active{background:var(--bg)}
.save:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.cta{display:block;margin-top:26px;text-align:center;background:var(--accent);color:var(--on-accent);padding:16px;border-radius:14px;font-weight:600;text-decoration:none}
</style>
</head>
